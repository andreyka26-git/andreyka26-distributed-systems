# Server side: copy this file to the server as docker-compose.yml.
#   docker compose pull
#   docker compose up -d
services:
  ngrok-server:
    # Not andreyka26-git? Change this to your own registry path, e.g.
    # ghcr.io/<your-github-user>/ngrok-server:latest (same in docker-compose.yml).
    image: ghcr.io/andreyka26-git/ngrok-server:latest
    init: true
    restart: unless-stopped
    ports:
      - "8000:8000"   # public side (visitors); use "80:8000" if port 80 is free
      - "9000:9000"   # control side (agents)
