# Runs in PARALLEL with ../postgres (port 5433, db 'demo') and the other folders:
# the compose project defaults to this folder name (postgres-dotnet), which namespaces
# networks/volumes; container names + host port below are unique too.
services:
  postgres:
    image: postgres:16
    container_name: concurrency-pg-dotnet     # globally-unique container name
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: seats
    # Host port 5434 -> avoids 5432 (local PG) and 5433 (../postgres demo).
    # Connect pgAdmin to: host=localhost port=5434 db=seats user=postgres pass=postgres
    ports:
      - "5434:5432"
    volumes:
      # Auto-creates & seeds the `seats` table on first boot.
      - ./sql/00_setup.sql:/docker-entrypoint-initdb.d/00_setup.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seats"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    container_name: concurrency-app-dotnet
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # In-network connection (service name 'postgres', internal port 5432).
      POSTGRES_CONNECTION: "Host=postgres;Port=5432;Database=seats;Username=postgres;Password=postgres"
